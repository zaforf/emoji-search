<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Search</title>
</head>
<body>
    <h1>Emoji Search</h1>
    <input type="text" id="searchBox" placeholder="Type to search for emojis...">
    <div id="results"></div>
    <div id="timeTaken"></div>
    <script>
        const searchBox = document.getElementById('searchBox');
        const resultsDiv = document.getElementById('results');
        const timeTakenDiv = document.getElementById('timeTaken');

        searchBox.addEventListener('input', async () => {
            const query = searchBox.value;
            const startTime = performance.now();
            const response = await fetch(`/search?query=${encodeURIComponent(query)}`);
            const data = await response.json();
            const endTime = performance.now();

            resultsDiv.innerHTML = data.results.map(emoji => `<div>${emoji.char} - ${emoji.name}</div>`).join('');
            timeTakenDiv.textContent = `Time taken: ${(endTime - startTime).toFixed(2)} ms`;
        });
    </script>
</body>
</html>
